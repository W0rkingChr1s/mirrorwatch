[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorwatch"
version = "0.1.0"
description = "Watch HTTP endpoints for new and changed files, mirror them locally, get notified."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["monitoring", "change-detection", "mirror", "telegram", "scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
mirrorwatch = "mirrorwatch.cli:main"

[tool.setuptools.packages.find]
include = ["mirrorwatch*"]
