services:
  mirrorwatch:
    # Pull the pre-built image published to GHCR by the build workflow.
    # For local development against your own changes, comment out `image:`
    # and uncomment `build: .` instead.
    image: ghcr.io/w0rkingchr1s/mirrorwatch:latest
    # build: .
    container_name: mirrorwatch
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MIRRORWATCH_INTERVAL=21600
      # Fixed times instead of an interval — uncomment both and MIRRORWATCH_INTERVAL
      # is ignored. Without a timezone the container's local time (UTC) is used.
      # - MIRRORWATCH_CHECK_TIMES=06:00,18:00
      # - MIRRORWATCH_TIMEZONE=Europe/Berlin
      - MIRRORWATCH_LOG_LEVEL=INFO
    volumes:
      - ./config:/config:ro
      - mirrorwatch-data:/data
    restart: unless-stopped
    labels:
      # Let Watchtower auto-update this container when a new :latest is pushed.
      - com.centurylinklabs.watchtower.enable=true

volumes:
  mirrorwatch-data:
